<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JL Mixing Studio architecture validation" />
    <title>JL Mixing Studio</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #f4f7fb;
        color: #172033;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .startup-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 244px minmax(0, 1fr);
        background: #f4f7fb;
      }

      .startup-sidebar {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 26px 16px 18px;
        background: #fff;
        border-right: 1px solid #dce3ec;
        color: #536078;
      }

      .startup-brand {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 10px 25px 5px;
        color: #111c31;
        font-size: 15px;
        font-weight: 750;
        letter-spacing: -0.015em;
      }

      .startup-brand-mark {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: #eaf2ff;
        color: #1758d5;
        font-size: 13px;
        font-weight: 850;
      }

      .startup-nav {
        display: grid;
        gap: 5px;
      }

      .startup-nav-line {
        height: 44px;
        border-radius: 8px;
        background: transparent;
        position: relative;
      }

      .startup-nav-line::after {
        content: "";
        position: absolute;
        left: 44px;
        top: 16px;
        width: 94px;
        height: 11px;
        border-radius: 999px;
        background: #e5eaf1;
      }

      .startup-nav-line:first-child {
        background: #eaf2ff;
        box-shadow: inset 3px 0 #246bfd;
      }

      .startup-nav-line:first-child::after {
        background: #c9dcff;
      }

      .startup-main {
        box-sizing: border-box;
        width: min(1280px, 100%);
        margin: 0 auto;
        padding: 38px 42px 64px;
      }

      .startup-heading {
        margin: 0;
        color: #172033;
        font-size: 2rem;
        font-weight: 750;
        line-height: 1.03;
        letter-spacing: -0.025em;
      }

      .startup-subheading {
        margin: 10px 0 0;
        color: #657089;
        font-size: 0.96rem;
      }

      .startup-hero {
        margin-top: 30px;
        min-height: 176px;
        border: 1px solid #dce3ec;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 6px 20px rgba(29, 45, 74, 0.045);
        display: flex;
        align-items: center;
        padding: 28px 30px;
        box-sizing: border-box;
      }

      .startup-pulse {
        width: 100%;
        max-width: 520px;
        display: grid;
        gap: 12px;
      }

      .startup-pulse-line {
        height: 13px;
        border-radius: 999px;
        background: #dce3ec;
        animation: startup-pulse 1.35s ease-in-out infinite alternate;
      }

      .startup-pulse-line:nth-child(1) { width: 34%; background: #c9dcff; }
      .startup-pulse-line:nth-child(2) { width: 68%; }
      .startup-pulse-line:nth-child(3) { width: 48%; background: #edf1f6; }

      .startup-grid {
        margin-top: 10px;
        display: grid;
        grid-template-columns: minmax(0, 1.58fr) minmax(310px, 0.82fr);
        gap: 10px;
      }

      .startup-card {
        min-height: 170px;
        border: 1px solid #dce3ec;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 6px 20px rgba(29, 45, 74, 0.045);
      }

      @keyframes startup-pulse {
        from { opacity: 0.48; }
        to { opacity: 0.9; }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-pulse-line { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="startup-shell" aria-label="JL Mixing Studio starting">
        <aside class="startup-sidebar" aria-hidden="true">
          <div class="startup-brand"><span class="startup-brand-mark">JL</span><span>Mixing Studio</span></div>
          <div class="startup-nav">
            <div class="startup-nav-line"></div>
            <div class="startup-nav-line"></div>
            <div class="startup-nav-line"></div>
            <div class="startup-nav-line"></div>
            <div class="startup-nav-line"></div>
          </div>
        </aside>
        <main class="startup-main">
          <h1 class="startup-heading">Dashboard</h1>
          <p class="startup-subheading">Loading your studio workspace…</p>
          <section class="startup-hero" aria-hidden="true">
            <div class="startup-pulse">
              <div class="startup-pulse-line"></div>
              <div class="startup-pulse-line"></div>
              <div class="startup-pulse-line"></div>
            </div>
          </section>
          <div class="startup-grid" aria-hidden="true">
            <section class="startup-card"></section>
            <section class="startup-card"></section>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
