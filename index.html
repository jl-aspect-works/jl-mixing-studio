<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JL Mixing Studio architecture validation" />
    <title>JL Mixing Studio</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #f4f0e8;
        color: #252525;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .startup-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 232px minmax(0, 1fr);
        background: #f4f0e8;
      }

      .startup-sidebar {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 30px 24px;
        background: #1d2024;
        color: #f8f4ec;
      }

      .startup-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .startup-brand-mark {
        width: 32px;
        height: 32px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 8px;
        display: grid;
        place-items: center;
        font-size: 12px;
      }

      .startup-nav {
        margin-top: 42px;
        display: grid;
        gap: 10px;
      }

      .startup-nav-line {
        height: 38px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.055);
      }

      .startup-nav-line:first-child {
        background: rgba(255, 255, 255, 0.12);
      }

      .startup-main {
        box-sizing: border-box;
        padding: 36px 42px 48px;
      }

      .startup-heading {
        margin: 0;
        font-size: 29px;
        font-weight: 650;
        line-height: 1.15;
      }

      .startup-subheading {
        margin: 8px 0 0;
        color: #6d6a64;
        font-size: 14px;
      }

      .startup-hero {
        margin-top: 28px;
        min-height: 160px;
        border: 1px solid #d8d2c8;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.7);
        display: flex;
        align-items: center;
        padding: 28px 30px;
        box-sizing: border-box;
      }

      .startup-pulse {
        width: 100%;
        max-width: 520px;
        display: grid;
        gap: 12px;
      }

      .startup-pulse-line {
        height: 13px;
        border-radius: 999px;
        background: #ddd7ce;
        animation: startup-pulse 1.35s ease-in-out infinite alternate;
      }

      .startup-pulse-line:nth-child(1) { width: 34%; }
      .startup-pulse-line:nth-child(2) { width: 68%; }
      .startup-pulse-line:nth-child(3) { width: 48%; }

      .startup-grid {
        margin-top: 20px;
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(260px, 0.75fr);
        gap: 20px;
      }

      .startup-card {
        min-height: 170px;
        border: 1px solid #d8d2c8;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.62);
      }

      @keyframes startup-pulse {
        from { opacity: 0.48; }
        to { opacity: 0.9; }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-pulse-line { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="startup-shell" aria-label="JL Mixing Studio starting">
        <aside class="startup-sidebar" aria-hidden="true">
          <div class="startup-brand"><span class="startup-brand-mark">JL</span><span>Mixing Studio</span></div>
          <div class="startup-nav">
            <div class="startup-nav-line"></div>
            <div class="startup-nav-line"></div>
            <div class="startup-nav-line"></div>
            <div class="startup-nav-line"></div>
            <div class="startup-nav-line"></div>
          </div>
        </aside>
        <main class="startup-main">
          <h1 class="startup-heading">Dashboard</h1>
          <p class="startup-subheading">Loading your studio workspace…</p>
          <section class="startup-hero" aria-hidden="true">
            <div class="startup-pulse">
              <div class="startup-pulse-line"></div>
              <div class="startup-pulse-line"></div>
              <div class="startup-pulse-line"></div>
            </div>
          </section>
          <div class="startup-grid" aria-hidden="true">
            <section class="startup-card"></section>
            <section class="startup-card"></section>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
