555" text-anchor="middle" class="s">Rev 5</text><text x="1120" y="555" class="s">›</text><rect x="1136" y="532" width="62" height="36" rx="4" class="rank"/><text x="1167" y="555" text-anchor="middle" class="s">Rev 1</text><text x="858" y="610" class="xs">Region names/times are historical snapshots.</text><text x="858" y="636" class="xs">Session winner and cumulative TOP are shown separately.</text>
