<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<style>
text{font-family:Arial,sans-serif;fill:#162033} .t{font-size:30px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:13px}.xs{font-size:11px}.box{fill:#fff;stroke:#b8c1cc;stroke-width:1.5}.panel{fill:#f7f9fb;stroke:#c8d0da}.dark{fill:#1e2631}.blue{fill:#edf5ff;stroke:#4d8fe8}.muted{fill:#eef1f4;stroke:#c8d0da}.line{stroke:#7f8a98;stroke-width:2}.wave{fill:none;stroke:#9aa5b1;stroke-width:1}.rank{fill:#fff;stroke:#aeb7c2}.note{fill:#fbfcfd;stroke:#c7ced7}
</style>
<rect width="1600" height="980" fill="#f4f6f8"/>
<text x="800" y="42" text-anchor="middle" class="t">BLIND REVISION COMPARISON — WIREFRAMES</text>
<text x="800" y="68" text-anchor="middle" class="s">Comparison workspace and Reveal / Results screen</text>
<!-- comparison -->
<text x="48" y="108" class="h">A  COMPARISON — During Session</text>
<rect x="48" y="126" width="730" height="760" rx="8" class="box"/>
<rect x="48" y="126" width="730" height="42" rx="8" class="dark"/>
<text x="66" y="153" fill="#fff" class="s">Blind Revision Comparison</text><text x="390" y="153" fill="#fff" class="xs">3 revisions • Loudness Match: ON</text>
<rect x="650" y="137" width="110" height="22" rx="4" fill="#2d3745" stroke="#718096"/><text x="705" y="152" text-anchor="middle" fill="#fff" class="xs">Cancel</text>
<!-- region/time -->
<text x="68" y="194" class="xs">REGION</text><rect x="68" y="202" width="150" height="34" rx="4" class="box"/><text x="82" y="224" class="s">Chorus ▾</text>
<text x="340" y="204" class="h">00:21.438 / 00:45.000</text><line x1="310" y1="226" x2="558" y2="226" class="line"/><circle cx="420" cy="226" r="6" fill="#fff" stroke="#617184"/><text x="345" y="247" class="xs">Looping</text>
<!-- waveform -->
<path d="M70 286 L82 280 L94 294 L106 274 L118 298 L130 277 L142 290 L154 270 L166 299 L178 276 L190 292 L202 271 L214 296 L226 282 L238 289 L250 273 L262 297 L274 281 L286 292 L298 272 L310 296 L322 279 L334 291 L346 274 L358 298 L370 280 L382 292 L394 271 L406 296 L418 282 L430 290 L442 274 L454 297 L466 279 L478 291 L490 272 L502 297 L514 280 L526 291 L538 273 L550 297 L562 280 L574 292 L586 271 L598 296 L610 281 L622 290 L634 273 L646 297 L658 280 L670 291 L682 272 L694 296 L706 281 L718 291 L730 275 L744 290" class="wave"/>
<rect x="300" y="260" width="258" height="50" fill="#dfe7ef" opacity=".7"/><line x1="300" y1="255" x2="300" y2="315" class="line"/><line x1="558" y1="255" x2="558" y2="315" class="line"/>
<!-- transport -->
<rect x="218" y="330" width="54" height="34" rx="5" class="box"/><text x="245" y="352" text-anchor="middle" class="s">|◀</text><rect x="282" y="330" width="66" height="34" rx="5" class="box"/><text x="315" y="352" text-anchor="middle" class="s">◀ 5s</text><circle cx="385" cy="347" r="26" fill="#fff" stroke="#8d99a8"/><text x="385" y="354" text-anchor="middle" class="h">▶</text><rect x="422" y="330" width="66" height="34" rx="5" class="box"/><text x="455" y="352" text-anchor="middle" class="s">5s ▶</text><rect x="498" y="330" width="54" height="34" rx="5" class="box"/><text x="525" y="352" text-anchor="middle" class="s">▶|</text><rect x="610" y="330" width="128" height="34" rx="5" class="blue"/><text x="674" y="352" text-anchor="middle" class="s">Loop: ON ⟳</text>
<!-- candidate controls moved close to playback -->
<rect x="68" y="382" width="342" height="105" rx="5" class="panel"/><text x="82" y="405" class="h">CANDIDATE SWITCH</text><text x="82" y="423" class="xs">A–Z keys or click. Active candidate stays synchronized.</text>
<rect x="82" y="438" width="54" height="36" rx="4" class="blue"/><text x="109" y="462" text-anchor="middle" class="h">A</text><rect x="144" y="438" width="54" height="36" rx="4" class="box"/><text x="171" y="462" text-anchor="middle" class="h">B</text><rect x="206" y="438" width="54" height="36" rx="4" class="box"/><text x="233" y="462" text-anchor="middle" class="h">C</text><rect x="268" y="438" width="38" height="36" rx="4" class="muted"/><text x="287" y="462" text-anchor="middle" class="s">D</text><text x="318" y="462" class="s">… Z</text>
<rect x="420" y="382" width="318" height="105" rx="5" class="panel"/><text x="434" y="405" class="h">SESSION PROGRESS</text><rect x="434" y="430" width="52" height="44" rx="4" class="box"/><text x="460" y="447" text-anchor="middle" class="xs">Intro</text><text x="460" y="465" text-anchor="middle" class="s">✓</text><rect x="493" y="430" width="62" height="44" rx="4" class="blue"/><text x="524" y="447" text-anchor="middle" class="xs">Chorus</text><text x="524" y="465" text-anchor="middle" class="xs">Active</text><rect x="562" y="430" width="52" height="44" rx="4" class="box"/><text x="588" y="447" text-anchor="middle" class="xs">Verse</text><text x="588" y="465" text-anchor="middle" class="xs">○</text><rect x="621" y="430" width="62" height="44" rx="4" class="box"/><text x="652" y="447" text-anchor="middle" class="xs">Bridge</text><text x="652" y="465" text-anchor="middle" class="xs">○</text><rect x="690" y="430" width="38" height="44" rx="4" class="box"/><text x="709" y="454" text-anchor="middle" class="xs">…</text>
<!-- ranking -->
<rect x="68" y="505" width="170" height="300" rx="5" class="panel"/><text x="82" y="530" class="h">UNRANKED</text><text x="82" y="550" class="xs">Drag candidates to rank rows.</text><rect x="82" y="572" width="142" height="42" rx="4" class="rank"/><text x="98" y="599" class="h">A</text><text x="204" y="599" class="s">▶</text><rect x="82" y="622" width="142" height="42" rx="4" class="rank"/><text x="98" y="649" class="h">B</text><text x="204" y="649" class="s">▶</text><rect x="82" y="672" width="142" height="42" rx="4" class="rank"/><text x="98" y="699" class="h">C</text><text x="204" y="699" class="s">▶</text>
<rect x="250" y="505" width="300" height="300" rx="5" class="panel"/><text x="264" y="530" class="h">RANK ORDER</text><text x="264" y="550" class="xs">Drop between rows = rank • same row = tie</text><text x="270" y="596" class="h">1</text><rect x="304" y="568" width="218" height="44" rx="4" class="rank"/><text x="413" y="595" text-anchor="middle" class="xs">Drop here for #1</text><text x="270" y="652" class="h">2</text><rect x="304" y="626" width="78" height="42" rx="4" class="rank"/><text x="343" y="653" text-anchor="middle" class="h">A</text><text x="270" y="708" class="h">3</text><rect x="304" y="682" width="78" height="42" rx="4" class="rank"/><text x="343" y="709" text-anchor="middle" class="h">C</text><rect x="400" y="682" width="78" height="42" rx="4" class="rank"/><text x="439" y="709" text-anchor="middle" class="h">B</text><text x="389" y="709" class="s">=</text><rect x="304" y="748" width="218" height="38" rx="4" class="box"/><text x="413" y="772" text-anchor="middle" class="s">No Preference</text>
<rect x="562" y="505" width="176" height="300" rx="5" class="panel"/><text x="576" y="530" class="h">CANDIDATE NOTES</text><text x="576" y="550" class="xs">Notes stay with candidate.</text><text x="576" y="590" class="h">A</text><rect x="602" y="566" width="120" height="48" rx="4" class="note"/><text x="612" y="592" class="xs">Type notes…</text><text x="576" y="650" class="h">B</text><rect x="602" y="626" width="120" height="48" rx="4" class="note"/><text x="612" y="652" class="xs">Type notes…</text><text x="576" y="710" class="h">C</text><rect x="602" y="686" width="120" height="48" rx="4" class="note"/><text x="612" y="712" class="xs">Type notes…</text>
<line x1="68" y1="828" x2="738" y2="828" stroke="#d1d7df"/><text x="82" y="854" class="s">🔊 ─────○    3 revisions • Looping ON</text><rect x="590" y="838" width="142" height="34" rx="4" class="blue"/><text x="661" y="860" text-anchor="middle" class="s">Mark Region Complete</text>
<!-- reveal -->
<text x="822" y="108" class="h">B  REVEAL / RESULTS — After Completion</text>
<rect x="822" y="126" width="730" height="760" rx="8" class="box"/><rect x="822" y="126" width="730" height="42" rx="8" class="dark"/><text x="840" y="153" fill="#fff" class="s">Blind Revision Comparison</text><text x="1140" y="153" fill="#fff" class="xs">REVEALED</text><rect x="1414" y="137" width="120" height="22" rx="4" fill="#2d3745" stroke="#718096"/><text x="1474" y="152" text-anchor="middle" fill="#fff" class="xs">Back</text>
<rect x="842" y="182" width="690" height="42" rx="5" fill="#edf8f2" stroke="#82b99c"/><text x="860" y="207" class="s">✓ Results revealed and session persisted</text>
<rect x="842" y="240" width="150" height="58" rx="5" class="panel"/><text x="917" y="264" text-anchor="middle" class="h">3</text><text x="917" y="284" text-anchor="middle" class="xs">Revisions</text><rect x="1002" y="240" width="150" height="58" rx="5" class="panel"/><text x="1077" y="264" text-anchor="middle" class="h">4</text><text x="1077" y="284" text-anchor="middle" class="xs">Regions</text><rect x="1162" y="240" width="170" height="58" rx="5" class="panel"/><text x="1247" y="264" text-anchor="middle" class="s">Loudness Match</text><text x="1247" y="284" text-anchor="middle" class="h">ON</text><rect x="1342" y="240" width="190" height="58" rx="5" class="panel"/><text x="1437" y="264" text-anchor="middle" class="s">Completed</text><text x="1437" y="284" text-anchor="middle" class="h">May 18, 2025</text>
