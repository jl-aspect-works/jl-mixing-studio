name: Temporary release version sync

on:
  push:
    branches:
      - release/v2.1.0-rc.7

permissions:
  contents: write

jobs:
  sync-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.1.0-rc.7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync and verify version metadata
        run: |
          npm run version:sync
          npm run version:verify
      - name: Commit synchronized metadata and remove temporary workflow
        run: |
          rm .github/workflows/release-version-sync-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json .github/workflows/release-version-sync-temp.yml
          git commit -m "Prepare Studio v2.1.0-rc.7"
          git push origin HEAD:release/v2.1.0-rc.7
