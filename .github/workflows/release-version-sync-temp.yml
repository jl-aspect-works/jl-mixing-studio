name: Temporary release version sync

on:
  push:
    branches:
      - release/v2.1.0-rc.6

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[version-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.1.0-rc.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Synchronize release metadata
        run: npm run version:sync
      - name: Verify release metadata
        run: npm run version:verify
      - name: Commit synchronized metadata and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-version-sync-temp.yml
          git add VERSION package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m 'Sync Studio release metadata for v2.1.0-rc.6 [version-sync]'
          git push origin HEAD:release/v2.1.0-rc.6
