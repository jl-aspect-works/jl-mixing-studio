name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Normal releases must be dispatched from main; got $GITHUB_REF" >&2
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: version
        name: Read VERSION
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid VERSION: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Synchronize version metadata from VERSION
        run: npm run version:sync
      - run: npm run version:verify
      - run: npm run check

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel DMG
            os: macos-15-intel
            platform: macos
            architecture: x86_64
            bundle_directory: dmg
            extension: dmg
          - label: macOS Apple Silicon DMG
            os: macos-15
            platform: macos
            architecture: aarch64
            bundle_directory: dmg
            extension: dmg
          - label: Windows x64 NSIS
            os: windows-latest
            platform: windows
            architecture: x86_64
            bundle_directory: nsis
            extension: exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Synchronize version metadata from VERSION
        run: npm run version:sync
      - name: Build installer
        run: npm run tauri build
      - name: Stage release asset
        run: >-
          node scripts/stage-release-asset.mjs
          "${{ needs.validate.outputs.tag }}"
          "${{ matrix.bundle_directory }}"
          "${{ matrix.extension }}"
          "${{ matrix.platform }}"
          "${{ matrix.architecture }}"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "JL-Mixing-Studio_${RELEASE_VERSION}_macos_x86_64.dmg"
            "JL-Mixing-Studio_${RELEASE_VERSION}_macos_aarch64.dmg"
            "JL-Mixing-Studio_${RELEASE_VERSION}_windows_x86_64.exe"
          )
          for asset in "${expected[@]}"; do
            test -s "release-assets/$asset"
          done
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 3
          (
            cd release-assets
            sha256sum "${expected[@]}" > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
      - name: Verify release notes
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/RELEASE_NOTES_V2.1.md
          grep -q 'Open Anyway' docs/RELEASE_NOTES_V2.1.md
          grep -q 'More info' docs/RELEASE_NOTES_V2.1.md
          grep -q 'SHA256SUMS.txt' docs/RELEASE_NOTES_V2.1.md
      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            target="$(git rev-list -n 1 "$RELEASE_TAG")"
            test "$target" = "$GITHUB_SHA" || {
              echo "Tag $RELEASE_TAG already points to $target, not $GITHUB_SHA" >&2
              exit 1
            }
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "JL Mixing Studio $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "JL Mixing Studio $RELEASE_TAG" \
              --notes-file docs/RELEASE_NOTES_V2.1.md \
              "${prerelease[@]}" \
              release-assets/*
          fi
