name: Temporary version sync

on:
  push:
    branches:
      - release/v2.1.0-rc.4

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.1.0-rc.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync generated version metadata
        run: node scripts/sync-version.mjs
      - name: Commit generated metadata and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-version-sync.yml
          git add VERSION package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "Sync Studio v2.1.0-rc.4 version metadata"
          git push origin HEAD:release/v2.1.0-rc.4
