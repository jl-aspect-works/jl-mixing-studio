name: Temp 305 Progress Diagnostic V2
on:
  push:
    branches:
      - feature/305-new-project-import-progress-ux
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          rust = Path('src-tauri/src/managed_client_files.rs')
          text = rust.read_text()
          old = '''    if !supports_import_progress(&home) {
        return call_api(app, &project, IMPORT_EXECUTE_OPERATION, arguments);
    }
    arguments.push("--progress=stderr-json".into());
    let arguments = with_project_argument(&project, arguments);
    match invoke_with_progress(&home, &arguments, IMPORT_EXECUTE_OPERATION, on_progress) {'''
          new = '''    let total = request.selected_relative_paths.as_ref().map_or(request.sources.len(), Vec::len);
    let mut on_progress = on_progress;
    if !supports_import_progress(&home) {
        on_progress(IntakeProgressEvent {
            operation: IMPORT_EXECUTE_OPERATION.into(),
            phase: "fallback".into(),
            completed: 0,
            total: Some(total),
            active: Vec::new(),
        });
        return call_api(app, &project, IMPORT_EXECUTE_OPERATION, arguments);
    }
    on_progress(IntakeProgressEvent {
        operation: IMPORT_EXECUTE_OPERATION.into(),
        phase: "starting".into(),
        completed: 0,
        total: Some(total),
        active: Vec::new(),
    });
    arguments.push("--progress=stderr-json".into());
    let arguments = with_project_argument(&project, arguments);
    match invoke_with_progress(&home, &arguments, IMPORT_EXECUTE_OPERATION, on_progress) {'''
          if old not in text: raise SystemExit('Rust target not found')
          rust.write_text(text.replace(old, new, 1))

          models = Path('src/intake/models.ts')
          text = models.read_text()
          old = 'phase: "staging" | "importing" | "complete";'
          if old not in text: raise SystemExit('Model target not found')
          models.write_text(text.replace(old, 'phase: "starting" | "fallback" | "staging" | "importing" | "complete";', 1))

          ui = Path('src/intake/ManagedFileOperationDialog.tsx')
          text = ui.read_text()
          old1 = '''        <strong>{mode === "import" ? (importProgress?.phase === "staging" ? `Preparing ${Math.min(importProgress.completed, displayImportTotal)} of ${displayImportTotal} files` : `Importing ${Math.min(importProgress?.completed ?? 0, displayImportTotal)} of ${displayImportTotal} files`) : "Updating Audio Prep…"}</strong>'''
          new1 = '''        <strong>{mode === "import" ? (!importProgress ? "Starting import…" : importProgress.phase === "fallback" ? "Import progress unavailable; importing files…" : importProgress.phase === "starting" ? "Starting streaming import…" : importProgress.phase === "staging" ? `Preparing ${Math.min(importProgress.completed, displayImportTotal)} of ${displayImportTotal} files` : `Importing ${Math.min(importProgress.completed, displayImportTotal)} of ${displayImportTotal} files`) : "Updating Audio Prep…"}</strong>'''
          old2 = '''        {mode === "import" ? (importProgress ? <progress aria-label={importProgress.phase === "staging" ? `Prepared ${importProgress.completed} of ${displayImportTotal} files` : `Imported ${importProgress.completed} of ${displayImportTotal} files`} value={importProgress.completed} max={Math.max(displayImportTotal, 1)} /> : <progress aria-label="Starting import" />) : <span className="client-files-spinner" aria-hidden="true" />}'''
          new2 = '''        {mode === "import" ? (!importProgress || importProgress.phase === "starting" || importProgress.phase === "fallback" ? <progress aria-label={importProgress?.phase === "fallback" ? "Import progress unavailable" : "Starting import"} /> : <progress aria-label={importProgress.phase === "staging" ? `Prepared ${importProgress.completed} of ${displayImportTotal} files` : `Imported ${importProgress.completed} of ${displayImportTotal} files`} value={importProgress.completed} max={Math.max(displayImportTotal, 1)} />) : <span className="client-files-spinner" aria-hidden="true" />}'''
          if old1 not in text or old2 not in text: raise SystemExit('UI target not found')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          ui.write_text(text)
          PY
      - name: Commit and clean helper
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/temp-305-progress-diagnostic.yml .github/workflows/temp-305-progress-diagnostic-v2.yml
          git add src-tauri/src/managed_client_files.rs src/intake/models.ts src/intake/ManagedFileOperationDialog.tsx
          git commit -m "Expose managed import progress path"
          git push
