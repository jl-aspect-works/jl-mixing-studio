name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Documentation and change scope
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.classify.outputs.full_ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test change-scope classifier
        run: python3 .github/scripts/test_change_scope.py
      - name: Test immutable release guard
        run: python3 .github/scripts/test_release_guard.py
      - id: classify
        name: Check changed files and documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/check-change-scope.py "$BASE_SHA" "$HEAD_SHA"

  frontend:
    name: Frontend checks
    needs: scope
    if: needs.scope.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend tests
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm test 2>&1 | tee artifacts/vitest.log
      - name: Upload frontend test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-log
          path: artifacts/vitest.log
          if-no-files-found: warn
          retention-days: 14
      - name: Verify icons
        run: npm run icons:verify
      - name: Build
        run: npm run build

  rust:
    name: Rust checks
    needs: scope
    if: needs.scope.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features

  desktop-check:
    name: ${{ matrix.name }} compile and Listening tests
    needs: scope
    if: needs.scope.outputs.full_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-15
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Check desktop compile
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-features
      - name: Run Listening filesystem regression tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features --lib listening
      - name: Run Reveal regression tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features --lib project_file_reveal
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/441-windows-reveal' && matrix.name != 'macOS Apple Silicon'
        with:
          node-version: 24
          cache: npm
      - name: Build installed Reveal acceptance package
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/441-windows-reveal' && matrix.name != 'macOS Apple Silicon'
        shell: bash
        run: |
          npm ci
          if [ "$RUNNER_OS" = Windows ]; then
            bundle_type=nsis
          else
            bundle_type=dmg
          fi
          npm run tauri build -- --bundles "$bundle_type" -- --locked
          mkdir -p artifacts/reveal-acceptance
          if [ "$RUNNER_OS" = Windows ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe artifacts/reveal-acceptance/
          else
            cp src-tauri/target/release/bundle/dmg/*.dmg artifacts/reveal-acceptance/
          fi
          printf 'Development test build for issue #441; not an official release.\nCommit: %s\n' "$GITHUB_SHA" > artifacts/reveal-acceptance/BUILD.txt
      - name: Upload installed Reveal acceptance package
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/441-windows-reveal' && matrix.name != 'macOS Apple Silicon'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reveal-acceptance-${{ matrix.os }}
          path: artifacts/reveal-acceptance/*
          if-no-files-found: error
          retention-days: 14

  macos-audio-preview-spike:
    name: ${{ matrix.name }} WKWebView audio preview spike
    needs: scope
    if: needs.scope.outputs.full_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Generate required audio fixtures
        run: bash scripts/macos-audio-preview-fixtures.sh "$RUNNER_TEMP/jl-audio-preview-fixtures"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - name: Build isolated rodio discovery diagnostic app
        run: |
          rustfmt --check scripts/macos-dante-rodio-probe.rs
          probe_app="$(bash scripts/build-macos-dante-rodio-probe.sh)"
          ditto -c -k --keepParent "$probe_app" "$RUNNER_TEMP/JL-Dante-Rodio-Probe.zip"
      - name: Upload rodio discovery diagnostic app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dante-rodio-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/JL-Dante-Rodio-Probe.zip
          if-no-files-found: error
          retention-days: 14
      - name: Build isolated Dante discovery diagnostic app
        run: |
          probe_app="$(bash scripts/build-macos-dante-probe.sh)"
          ditto -c -k --keepParent "$probe_app" "$RUNNER_TEMP/JL-Dante-Probe.zip"
      - name: Upload Dante discovery diagnostic app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dante-discovery-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/JL-Dante-Probe.zip
          if-no-files-found: error
          retention-days: 14
      - name: Probe required formats through WKWebView
        run: |
          swift scripts/macos-wkwebview-audio-probe.swift \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/wav16-44100-mono.wav" \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/wav24-48000-stereo.wav" \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/wavf32-96000-stereo.wav" \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/aiff24-48000-stereo.aiff" \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/mp3-44100-stereo.mp3" \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/flac-48000-stereo.flac" \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/aac-48000-stereo.aac" \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/m4a-48000-stereo.m4a" \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/mp4-48000-stereo.mp4"

  windows-audio-spike-test-installer:
    name: Windows audio spike test installer
    needs: scope
    if: needs.scope.outputs.full_ci == 'true' && github.event_name == 'pull_request' && github.head_ref == 'spike/v2.1-windows-native-audio-preview'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Ensure ffmpeg and NSIS are available
        shell: powershell
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
      - name: Generate required Windows audio fixtures
        shell: powershell
        run: ./scripts/windows-audio-preview-fixtures.ps1 -OutDir "$env:RUNNER_TEMP/jl-audio-preview-fixtures"
      - name: Build release-mode native probe
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bin windows_audio_preview_spike
      - name: Package per-user NSIS test installer
        shell: powershell
        run: ./scripts/package-windows-audio-spike-test.ps1 -FixtureDir "$env:RUNNER_TEMP/jl-audio-preview-fixtures" -OutDir "$env:RUNNER_TEMP/jl-audio-spike-installer"
      - name: Upload Windows spike test installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-audio-spike-test-installer
          path: ${{ runner.temp }}/jl-audio-spike-installer/JL-Mixing-Studio_Windows-Audio-Spike-Test_x64.exe
          if-no-files-found: error
          retention-days: 14

  macos-bundle-signature-acceptance:
    name: macOS ${{ matrix.arch }} signed-DMG acceptance
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/521-macos-bundle-signature'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: intel
            os: macos-15-intel
          - arch: apple-silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: npm ci
      - name: Build ad-hoc signed macOS DMG
        run: npm run tauri build -- --bundles dmg -- --locked
      - name: Validate resource-sealed app inside finished DMG
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#installers[@]}" -eq 1
          bash scripts/verify-macos-dmg-signature.sh "${installers[0]}"
      - name: Stage installed acceptance artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/macos-signature
          cp src-tauri/target/release/bundle/dmg/*.dmg artifacts/macos-signature/
          printf 'Issue #521 development acceptance build; not a release.\nCommit: %s\n' "$GITHUB_SHA" > artifacts/macos-signature/BUILD.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-signature-acceptance-${{ matrix.arch }}
          path: artifacts/macos-signature/*
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required CI
    if: always()
    needs: [scope, frontend, rust, desktop-check, macos-audio-preview-spike, windows-audio-spike-test-installer, macos-bundle-signature-acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the checks required for this change passed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          FULL_CI: ${{ needs.scope.outputs.full_ci }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          DESKTOP_RESULT: ${{ needs.desktop-check.result }}
          AUDIO_RESULT: ${{ needs.macos-audio-preview-spike.result }}
          WINDOWS_SPIKE_RESULT: ${{ needs.windows-audio-spike-test-installer.result }}
          MACOS_SIGNATURE_RESULT: ${{ needs.macos-bundle-signature-acceptance.result }}
          MACOS_SIGNATURE_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/521-macos-bundle-signature' }}
          SPIKE_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref == 'spike/v2.1-windows-native-audio-preview' }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$FULL_CI" = true ]; then
            test "$FRONTEND_RESULT" = success
            test "$RUST_RESULT" = success
            test "$DESKTOP_RESULT" = success
            test "$AUDIO_RESULT" = success
            if [ "$SPIKE_BRANCH" = true ]; then
              test "$WINDOWS_SPIKE_RESULT" = success
            fi
            if [ "$MACOS_SIGNATURE_BRANCH" = true ]; then
              test "$MACOS_SIGNATURE_RESULT" = success
            fi
          else
            test "$FULL_CI" = false
          fi
