name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Documentation and change scope
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.classify.outputs.full_ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        name: Check changed files and documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/check-change-scope.py "$BASE_SHA" "$HEAD_SHA"

  frontend:
    name: Frontend checks
    needs: scope
    if: needs.scope.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend tests
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm test 2>&1 | tee artifacts/vitest.log
      - name: Upload frontend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-log
          path: artifacts/vitest.log
          if-no-files-found: warn
          retention-days: 14
      - name: Verify icons
        run: npm run icons:verify
      - name: Build
        run: npm run build

  rust:
    name: Rust checks
    needs: scope
    if: needs.scope.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

  desktop-check:
    name: ${{ matrix.name }} compile and Listening tests
    needs: scope
    if: needs.scope.outputs.full_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-15
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Check desktop compile
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-features
      - name: Run Listening filesystem regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --lib listening

  macos-audio-preview-spike:
    name: ${{ matrix.name }} WKWebView audio preview spike
    needs: scope
    if: needs.scope.outputs.full_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Generate required audio fixtures
        run: bash scripts/macos-audio-preview-fixtures.sh "$RUNNER_TEMP/jl-audio-preview-fixtures"
      - name: Probe required formats through WKWebView
        run: |
          swift scripts/macos-wkwebview-audio-probe.swift \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/wav16-44100-mono.wav" \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/wav24-48000-stereo.wav" \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/wavf32-96000-stereo.wav" \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/aiff24-48000-stereo.aiff" \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/mp3-44100-stereo.mp3" \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/flac-48000-stereo.flac" \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/aac-48000-stereo.aac" \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/m4a-48000-stereo.m4a" \
            "$RUNNER_TEMP/jl-audio-preview-fixtures/mp4-48000-stereo.mp4"

  windows-audio-spike-test-installer:
    name: Windows audio spike test installer
    needs: scope
    if: needs.scope.outputs.full_ci == 'true' && github.event_name == 'pull_request' && github.head_ref == 'spike/v2.1-windows-native-audio-preview'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure ffmpeg and NSIS are available
        shell: powershell
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
      - name: Generate required Windows audio fixtures
        shell: powershell
        run: ./scripts/windows-audio-preview-fixtures.ps1 -OutDir "$env:RUNNER_TEMP/jl-audio-preview-fixtures"
      - name: Build release-mode native probe
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin windows_audio_preview_spike
      - name: Package per-user NSIS test installer
        shell: powershell
        run: ./scripts/package-windows-audio-spike-test.ps1 -FixtureDir "$env:RUNNER_TEMP/jl-audio-preview-fixtures" -OutDir "$env:RUNNER_TEMP/jl-audio-spike-installer"
      - name: Upload Windows spike test installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-audio-spike-test-installer
          path: ${{ runner.temp }}/jl-audio-spike-installer/JL-Mixing-Studio_Windows-Audio-Spike-Test_x64.exe
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required CI
    if: always()
    needs: [scope, frontend, rust, desktop-check, macos-audio-preview-spike, windows-audio-spike-test-installer]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the checks required for this change passed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          FULL_CI: ${{ needs.scope.outputs.full_ci }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          DESKTOP_RESULT: ${{ needs.desktop-check.result }}
          AUDIO_RESULT: ${{ needs.macos-audio-preview-spike.result }}
          WINDOWS_SPIKE_RESULT: ${{ needs.windows-audio-spike-test-installer.result }}
          SPIKE_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref == 'spike/v2.1-windows-native-audio-preview' }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$FULL_CI" = true ]; then
            test "$FRONTEND_RESULT" = success
            test "$RUST_RESULT" = success
            test "$DESKTOP_RESULT" = success
            test "$AUDIO_RESULT" = success
            if [ "$SPIKE_BRANCH" = true ]; then
              test "$WINDOWS_SPIKE_RESULT" = success
            fi
          else
            test "$FULL_CI" = false
          fi
