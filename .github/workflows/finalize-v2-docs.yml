name: Finalize Studio 2.0 documentation records

on:
  push:
    branches:
      - "release/v2.0.0-final"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize acceptance, roadmap, and PRD status
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/v2.0-coordinated-acceptance.md')
          text = p.read_text()
          text = text.replace('Status: **RC acceptance in progress**', 'Status: **RC3 accepted; stable 2.0 release approved**', 1)
          text = text.replace('- First coordinated release candidate: `v2.0.0-rc.1` for each product', '- Final accepted candidates: Studio `v2.0.0-rc.3` with Automation `v2.0.0-rc.1`', 1)
          rc_start = text.index('## RC record')
          decision_start = text.index('## Final coordinated release decision', rc_start)
          rc = '''## RC record\n\n| Item | Value |\n| --- | --- |\n| Automation RC | `v2.0.0-rc.1` |\n| Automation commit | `7291ef4e2e48e4c19b1b1a8f0ca7694f7623dcbd` |\n| Automation API | `1.0` |\n| Studio RC | `v2.0.0-rc.3` |\n| Studio commit | `d15438237e6184e4c8d93f06510b448cce750f13` |\n| Workspace metadata schema | `1.1.0` |\n| Intel macOS packaged acceptance | Pass |\n| Apple Silicon packaged acceptance | Deferred — hardware unavailable for manual packaged acceptance; CI compile/WKWebView matrix passed |\n| Windows x64 packaged acceptance | Pass |\n| Shared-workspace normal/external-refresh acceptance | Pass |\n| Open release-blocking defects | None after final RC3 packaged validation |\n\n'''
          text = text[:rc_start] + rc + text[decision_start:]
          text = text.replace('- [ ] Exact RC versions/commits and remaining environment evidence are recorded above.', '- [x] Exact accepted RC versions/commits and available environment evidence are recorded above.', 1)
          p.write_text(text)

          p = Path('docs/ROADMAP.md')
          text = p.read_text()
          text = text.replace('Studio v1.1 supports Automation API `1.0` and metadata schema `1.1.0`. Product-version equality between Studio and Automation is neither required nor sufficient for compatibility.', 'Studio 2.0 supports Automation API `1.0` and metadata schema `1.1.0`. Product-version equality between Studio and Automation is neither required nor sufficient for compatibility.', 1)
          text = text.replace('## Current release priority\n\nComplete packaged coordinated acceptance of the refreshed Studio v1.1 line against JL Mixing Automation v1.5, fix only confirmed release defects, keep documentation current, and publish a refreshed Studio release only from a reviewed green merge commit.', '## Current release priority\n\nStudio 2.0 Daily Workflow implementation and coordinated release-candidate acceptance are complete. The current priority is stable 2.0 publication and maintenance from reviewed green commits; future feature work remains version-agnostic until explicitly approved and assigned.', 1)
          p.write_text(text)

          p = Path('docs/PRD.md')
          text = p.read_text()
          old = '**Status:** Current v1.1 product baseline\n'
          new = '**Status:** Historical v1.1 product baseline. The current Studio 2.0 release contract is defined by `docs/development-status.md` and `docs/v2.0-coordinated-acceptance.md`.\n'
          if old not in text:
              raise SystemExit('PRD status marker not found')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Remove temporary documentation workflow
        run: rm .github/workflows/finalize-v2-docs.yml
      - name: Commit documentation finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v2.0-coordinated-acceptance.md docs/ROADMAP.md docs/PRD.md .github/workflows/finalize-v2-docs.yml
          git commit -m "Finalize Studio 2.0 release documentation"
          git push origin HEAD:${GITHUB_REF_NAME}
