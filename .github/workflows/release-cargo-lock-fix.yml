name: Normalize release Cargo lock

on:
  push:
    branches:
      - release/v2.1.0-rc.1

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Restore main lock and update only root package version
        run: |
          git checkout origin/main -- src-tauri/Cargo.lock
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/Cargo.lock')
          text = path.read_text()
          old = 'name = "jl-mixing-studio"\nversion = "1.0.0-rc.4"'
          new = 'name = "jl-mixing-studio"\nversion = "2.1.0-rc.1"'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one root package version match, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/release-cargo-lock-fix.yml
      - name: Commit normalized Cargo lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock .github/workflows/release-cargo-lock-fix.yml
          git commit -m "Normalize Studio 2.1 RC Cargo lock version"
          git push origin HEAD:${{ github.ref_name }}
