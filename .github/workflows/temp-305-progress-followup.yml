name: Temp refine import progress UX
on:
  push:
    branches:
      - feature/305-new-project-import-progress-ux
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/305-new-project-import-progress-ux
      - name: Make staging determinate and remove post-Done workspace refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          dialog = Path('src/intake/ManagedFileOperationDialog.tsx')
          text = dialog.read_text()
          old = '''      {state.status === "executing" && <div className="managed-operation-progress managed-operation-progress-primary" role="status" aria-live="polite">\n        <strong>{mode === "import" ? (importProgress?.phase === "staging" ? "Preparing files for import…" : `Importing ${Math.min(importProgress?.completed ?? 0, displayImportTotal)} of ${displayImportTotal} files`) : "Updating Audio Prep…"}</strong>\n        {mode === "import" ? (importProgress?.phase === "importing" || importProgress?.phase === "complete" ? <progress aria-label={`Imported ${importProgress.completed} of ${displayImportTotal} files`} value={importProgress.completed} max={Math.max(displayImportTotal, 1)} /> : <progress aria-label="Preparing files for import" />) : <span className="client-files-spinner" aria-hidden="true" />}\n'''
          new = '''      {state.status === "executing" && <div className="managed-operation-progress managed-operation-progress-primary" role="status" aria-live="polite">\n        <strong>{mode === "import" ? (importProgress?.phase === "staging" ? `Preparing ${Math.min(importProgress.completed, displayImportTotal)} of ${displayImportTotal} files` : `Importing ${Math.min(importProgress?.completed ?? 0, displayImportTotal)} of ${displayImportTotal} files`) : "Updating Audio Prep…"}</strong>\n        {mode === "import" ? (importProgress ? <progress aria-label={importProgress.phase === "staging" ? `Prepared ${importProgress.completed} of ${displayImportTotal} files` : `Imported ${importProgress.completed} of ${displayImportTotal} files`} value={importProgress.completed} max={Math.max(displayImportTotal, 1)} /> : <progress aria-label="Starting import" />) : <span className="client-files-spinner" aria-hidden="true" />}\n'''
          if old not in text:
              raise SystemExit('executing progress block not found')
          dialog.write_text(text.replace(old, new, 1))

          app_dialogs = Path('src/app/AppDialogs.tsx')
          text = app_dialogs.read_text()
          old = '      onClose={() => { projects.setPostCreateImport(null); void onRefresh(); }}\n'
          new = '      onClose={() => projects.setPostCreateImport(null)}\n'
          if old not in text:
              raise SystemExit('post-create import onClose block not found')
          app_dialogs.write_text(text.replace(old, new, 1))

          tests = Path('src/intake/ManagedFileOperationDialog.test.tsx')
          text = tests.read_text()
          marker = '''  it("passes only Add-selected files and ignores conflicts on skipped files", async () => {\n'''
          test = '''  it("shows determinate staging progress from managed import events", async () => {\n    let resolveImport!: (value: typeof success) => void;\n    mocked(executeManagedImport).mockReturnValue(new Promise((resolve) => { resolveImport = resolve; }));\n    render(<ManagedFileOperationDialog clientId="client" projectId="project" mode="import" onClose={vi.fn()} onCompleted={vi.fn()} />);\n    fireEvent.click(screen.getByRole("button", { name: /Files/ }));\n    await screen.findByRole("table");\n    fireEvent.change(screen.getByLabelText("Client Files action for vocal.wav"), { target: { value: "replace" } });\n    fireEvent.change(screen.getByLabelText("Audio Prep action for vocal.wav"), { target: { value: "skip" } });\n    fireEvent.click(screen.getByRole("button", { name: "Import Files" }));\n    window.dispatchEvent(new CustomEvent("managed-import-progress", { detail: { clientId: "client", projectId: "project", phase: "staging", completed: 1, total: 1, active: [] } }));\n    resolveImport(success);\n  });\n\n'''
          # Don't add a brittle fake Tauri-event test here; product CI already exercises event wiring separately.
          # Instead update the existing static expectation only if a direct staging label assertion exists later.
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          # Intentionally no insertion; keep test suite behavior-oriented and avoid mocking Tauri listen internals.
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temp-305-progress-followup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine new-project import progress feedback'
          git push origin HEAD:feature/305-new-project-import-progress-ux
