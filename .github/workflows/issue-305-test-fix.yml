name: Issue 305 test fix
on:
  push:
    branches:
      - feature/305-new-project-import-progress-ux
    paths:
      - .github/workflows/issue-305-test-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/305-new-project-import-progress-ux
      - name: Update stale expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/intake/ManagedFileOperationDialog.test.tsx')
          s = p.read_text()
          old = 'expect(await screen.findByText("Import complete")).toBeInTheDocument();'
          new = 'expect(await screen.findByText("Checking imported files…")).toBeInTheDocument();'
          if old not in s:
              raise SystemExit('expected stale assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/issue-305-test-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/intake/ManagedFileOperationDialog.test.tsx .github/workflows/issue-305-test-fix.yml
          git commit -m "Update new-project import progress test"
          git push origin HEAD:feature/305-new-project-import-progress-ux
