name: Sync release lockfile versions

on:
  push:
    branches:
      - release/v2.1.0-rc.1

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Synchronize generated lockfile release versions
        run: |
          npm version 2.1.0-rc.1 --no-git-tag-version --allow-same-version
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null
          rm .github/workflows/release-lock-sync.yml
      - name: Commit synchronized lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.lock .github/workflows/release-lock-sync.yml
          git diff --cached --quiet && exit 0
          git commit -m "Sync Studio 2.1 RC lockfile versions"
          git push origin HEAD:${{ github.ref_name }}
