name: RC Version Sync

on:
  push:
    branches:
      - release/v2.0.0-rc.1-prep

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.0.0-rc.1-prep
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Regenerate lockfile release metadata
        run: npm version 2.0.0-rc.1 --no-git-tag-version --allow-same-version
      - name: Refresh Cargo lockfile package version
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Verify release metadata
        run: npm run release:verify -- v2.0.0-rc.1
      - name: Commit generated metadata and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git rm .github/workflows/rc-version-sync.yml
          git commit -m "Synchronize Studio v2.0.0-rc.1 lockfiles"
          git push origin HEAD:release/v2.0.0-rc.1-prep
