name: Apply UI copy #299

on:
  push:
    branches:
      - fix/299-ui-copy-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/299-ui-copy-polish
      - name: Apply approved copy changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'src/resources/copy.ts': {
                  'Your studio setup, mix defaults, workspace, and troubleshooting details.': 'Your studio details, mix defaults, workspace, and tools—all in one place.',
                  'identity: "Identity"': 'identity: "Studio Details"',
                  'audioDefaults: "Audio defaults"': 'audioDefaults: "Mix Defaults"',
                  'configuredRoot: "Configured root"': 'configuredRoot: "Workspace Location"',
              },
              'src/client/ClientDetailsV21.tsx': {
                  'Stable identity and display defaults.': 'Client name, ID, and default artist.',
                  'Read-only authoritative metadata.': 'Storage and technical details for this client.',
              },
              'src/intake/IntakeViews.tsx': {
                  'The client’s supplied source material is preserved here unchanged. Managed Import is the controlled way to add or replace client-delivered files.': 'The client’s files stay read-only here. Use Import Client Files to add new files or replace existing client files.',
              },
              'src-tauri/src/derived.rs': {
                  'Review the deadline and current revision, approval, and delivery state.': 'Check the deadline and make sure the current revision, approval, and delivery are where you expect.',
                  'Open Delivery and review the authoritative package state.': 'Open Delivery and create or update the package for the approved revision.',
                  'Open Revisions and review the current revision; this does not imply approval readiness.': 'Open Revisions and check the current revision before deciding whether it’s ready for approval.',
              },
          }

          for name, mapping in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in mapping.items():
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{name}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)

          # Update any explicit user-visible copy assertions that intentionally
          # duplicate these exact strings.
          test_roots = [Path('src'), Path('src-tauri')]
          flat = {}
          for mapping in replacements.values():
              flat.update(mapping)
          for root in test_roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.ts', '.tsx', '.rs'}:
                      continue
                  if str(path) in replacements:
                      continue
                  text = path.read_text()
                  updated = text
                  for old, new in flat.items():
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated)
          PY

          echo 'Remaining user-facing implementation jargon candidates in task/recovery code:'
          grep -RniE 'recommended_action|recovery:|authoritative|provider|schema' src-tauri/src/derived.rs src-tauri/src/workspace.rs src-tauri/src/models 2>/dev/null || true

          git diff --check
          git status --short
      - name: Commit copy changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src src-tauri
          git commit -m 'Polish v2.1 user-facing copy'
          git push origin HEAD:fix/299-ui-copy-polish
