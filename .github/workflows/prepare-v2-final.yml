name: Prepare Studio 2.0 final metadata

on:
  push:
    branches:
      - "release/v2.0.0-final"

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Update npm version metadata
        run: npm version 2.0.0 --no-git-tag-version --allow-same-version
      - name: Update Tauri and Cargo version metadata
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.version = '2.0.0';
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/Cargo.toml')
          text = path.read_text()
          old = 'version = "2.0.0-rc.3"'
          new = 'version = "2.0.0"'
          if old not in text:
              raise SystemExit('expected Cargo version not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary preparation workflow
        run: rm .github/workflows/prepare-v2-final.yml
      - name: Commit final version metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/tauri.conf.json .github/workflows/prepare-v2-final.yml
          git commit -m "Prepare Studio v2.0.0 final metadata"
          git push origin HEAD:${GITHUB_REF_NAME}
